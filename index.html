<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="description" content="Corporate gifting company in Ahmedabad. Bulk company gifts with your logo — diaries, drinkware, bags, pens and premium gift sets. GST invoice, all-India delivery, quotation on request." />
    <link rel="canonical" href="https://www.aurevagift.com/" />
    <meta name="theme-color" content="#0F172A" />
    <meta name="robots" content="index, follow, max-image-preview:large" />

    <!-- A link pasted into WhatsApp or LinkedIn showed a bare URL before this.
         For B2B in India that is where most sharing happens. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Aureva Corporate Gifting" />
    <meta property="og:title" content="Corporate Gifting in Ahmedabad | Bulk Company Gifts | Aureva" />
    <meta property="og:description" content="Bulk corporate gifts with your logo, delivered across India from Ahmedabad. GST invoice and quotation on request." />
    <meta property="og:url" content="https://www.aurevagift.com/" />
    <meta property="og:image" content="https://www.aurevagift.com/share.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_IN" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Corporate Gifting in Ahmedabad | Aureva" />
    <meta name="twitter:description" content="Bulk corporate gifts with your logo, delivered across India from Ahmedabad." />
    <meta name="twitter:image" content="https://www.aurevagift.com/share.png" />

    <!-- Tells Google this is a real business at a real address in Ahmedabad,
         which is what connects the site to a Google Maps listing. Opening
         hours are deliberately absent: Maps takes those from the Business
         Profile, and inventing them here would publish times we do not keep. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Store",
      "@id": "https://www.aurevagift.com/#business",
      "name": "Aureva Corporate Gifting",
      "legalName": "MSD Corporation",
      "description": "Corporate gifting company in Ahmedabad supplying bulk branded gifts to businesses across India.",
      "url": "https://www.aurevagift.com/",
      "telephone": "+91-98256-22421",
      "email": "aurevagifts@gmail.com",
      "priceRange": "₹₹",
      "currenciesAccepted": "INR",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "1203, Block B, S Bopal Road, near Swapneel Elysium, South Bopal",
        "addressLocality": "Ahmedabad",
        "addressRegion": "Gujarat",
        "postalCode": "380057",
        "addressCountry": "IN"
      },
      "areaServed": [
        { "@type": "City", "name": "Ahmedabad" },
        { "@type": "State", "name": "Gujarat" },
        { "@type": "Country", "name": "India" }
      ],
      "knowsAbout": [
        "Corporate gifting", "Bulk gifting", "Branded merchandise",
        "Diwali corporate gifts", "Employee welcome kits", "Logo printing"
      ]
    }
    </script>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><path d='M16 2L6 16L16 30L26 16L16 2Z' stroke='%23d4af37' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round' fill='none'/><path d='M16 8L10 16L16 24L22 16L16 8Z' stroke='%23d4af37' stroke-width='1' stroke-linecap='round' stroke-linejoin='round' fill='none'/><path d='M16 13L13.5 16L16 19L18.5 16L16 13Z' fill='%23d4af37'/></svg>" />
    <style>
      #initial-loader {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background-color: #0F172A;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 99999;
        transition: opacity 0.5s ease;
      }
      .loader-logo-svg {
        animation: pulse 2s infinite ease-in-out;
      }
      .loader-text {
        color: #fff;
        font-family: ui-serif, Georgia, Cambria, "Times New Roman", Times, serif;
        font-weight: 900;
        letter-spacing: 0.25em;
        font-size: 24px;
        margin-top: 16px;
        text-transform: uppercase;
      }
      .loader-subtext {
        color: #d4af37;
        font-family: ui-sans-serif, system-ui, sans-serif;
        font-weight: 700;
        letter-spacing: 0.45em;
        font-size: 9px;
        margin-top: 6px;
        text-transform: uppercase;
      }
      @keyframes pulse {
        0% { transform: scale(0.95); opacity: 0.8; }
        50% { transform: scale(1.05); opacity: 1; }
        100% { transform: scale(0.95); opacity: 0.8; }
      }
    </style>
  </head>
  <body>
    <div id="initial-loader">
      <svg width="48" height="48" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" class="loader-logo-svg">
        <path d="M16 2L6 16L16 30L26 16L16 2Z" stroke="#d4af37" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M16 8L10 16L16 24L22 16L16 8Z" stroke="#d4af37" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M16 13L13.5 16L16 19L18.5 16L16 13Z" fill="#d4af37"/>
      </svg>
      <div class="loader-text">AUREVA</div>
      <div class="loader-subtext">Corporate Gifting</div>
    </div>
    <div id="root"></div>
    <script>
      // The overlay sits at z-index 99999 and swallows every click, so it must
      // come down as soon as the app is interactive. 'load' alone is not safe:
      // it waits on remote fonts and images, which may be slow or blocked.
      // main.tsx calls this as soon as React mounts; the rest are backstops.
      window.__hideLoader = () => {
        const loader = document.getElementById('initial-loader');
        if (!loader) return;
        loader.style.opacity = '0';
        setTimeout(() => loader.remove(), 500);
      };
      window.addEventListener('load', () => window.__hideLoader());
      setTimeout(() => window.__hideLoader(), 5000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
